[parameters]
client=cds
dataset=reanalysis-era5-single-levels

# Output path (you can use the partition_keys in the target_path)
target_path=examples/download_hourly_data_by_day/data/{variable}/{year}{month:02d}{day:02d}.nc

partition_keys=
    year
    month
    day
    variable

[selection]
product_type=reanalysis
format=netcdf

# Grid and area
grid=0.25/0.25
area=90/-180/15/-45

# Full date range: 1940-2025
year=1991/to/1991
month=12/to/12

# Get all days in each month
day=03/to/31

# All 24 hours
time=00/to/23

# Variables to download
variable=
    2m_temperature
    mean_sea_level_pressure
