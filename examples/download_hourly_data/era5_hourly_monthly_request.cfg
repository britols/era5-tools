[parameters]
client=cds
dataset=reanalysis-era5-single-levels

# Output path (you can use the partition_keys in the target_path)
# One request -> one file per month, each holding all hourly (00-23) steps
target_path=examples/download_hourly_data_by_month/data/{variable}/{year}{month:02d}.nc

partition_keys=
    year
    month
    variable

[selection]
product_type=reanalysis
format=netcdf

# Grid and area
grid=0.25/0.25
area=90/-180/15/-45

# Full date range: 1940-2025
year=1980/to/1991
month=01/to/12

# day=all is collapsed into a full-month date range (YYYY-MM-01/YYYY-MM-last);
# hourly steps are still preserved via the time= field below
day=all

# All 24 hours
time=00/to/23

# Variables to download
variable=
    2m_temperature
    mean_sea_level_pressure
