[parameters]
client=cds
dataset=reanalysis-era5-single-levels

# Output path (you can use the partition_keys in the target_path)
target_path=examples/convert_hourly_to_daily/data/hourly/{variable}/{year}{month:02d}.nc

partition_keys=
    year
    month
    variable

[selection]
product_type=reanalysis
format=netcdf

# Grid and area
grid=0.25/0.25
area=90/-150/15/-45

# Full date range: 1940-2025
year=1940/to/1940
month=01/to/12

# Get all days in each month
day=all

# All 24 hours
time=00/to/23

# Variables to download
variable=
    2m_temperature
