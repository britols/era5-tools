[parameters]
client=cds
dataset=reanalysis-era5-single-levels-monthly-means

# Output path (you can use the partition_keys in the target_path)
target_path=examples/monthly_GMST/data/{variable}/{year}.nc

partition_keys=
    year
    variable

[selection]
product_type=reanalysis
format=netcdf

# Grid and area
grid=0.25/0.25

# Full date range: 1940-2025
year=1980/to/1985
month=01/to/12
time=00

# Variables to download
variable=
    2m_temperature
